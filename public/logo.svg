<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="psyA" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="60%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="psyB" x1="16" y1="16" x2="56" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feFlood flood-color="#14B8A6" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle — calm, grounded -->
  <circle cx="40" cy="40" r="36" fill="url(#psyA)" opacity="0.08"/>

  <!-- Soft ring — trust & connection -->
  <circle cx="40" cy="40" r="36" fill="none" stroke="url(#psyA)" stroke-width="1.5" opacity="0.2"/>

  <!-- The "P" mark — minimal, serene, brain-inspired -->
  <!-- Bowl of the P — gentle organic circle suggesting a calm mind -->
  <path
    d="M50 28
       C50 22.4 45.6 18 40 18
       C34.4 18 30 22.4 30 28
       C30 33.6 34.4 38 40 38
       C42.8 38 45.4 36.8 47.2 34.8"
    fill="none"
    stroke="url(#psyA)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Stem of the P — grounded, steady -->
  <line
    x1="40" y1="38"
    x2="40" y2="60"
    stroke="url(#psyB)"
    stroke-width="4.5"
    stroke-linecap="round"
  />

  <!-- Accent dot — life, wellness, growth -->
  <circle cx="56" cy="22" r="3.5" fill="url(#psyA)" opacity="0.7"/>
</svg>
