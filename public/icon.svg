<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="badgeBg" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#0F2D37"/>
      <stop offset="100%" stop-color="#0A1926"/>
    </linearGradient>

    <linearGradient id="neonPulse" x1="16" y1="16" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="40%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="neonBorder" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#14B8A6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.7"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="3" y="3" width="74" height="74" rx="20" fill="url(#badgeBg)"/>
  <rect x="3.5" y="3.5" width="73" height="73" rx="19.5" stroke="url(#neonBorder)" stroke-width="1.8"/>

  <g filter="url(#neonGlow)">
    <rect x="34.5" y="16" width="11" height="48" rx="5.5" fill="url(#neonPulse)"/>
    <rect x="16" y="34.5" width="48" height="11" rx="5.5" fill="url(#neonPulse)"/>
    <circle cx="40" cy="40" r="6" fill="#FFFFFF"/>
    <circle cx="40" cy="40" r="3.2" fill="#0E7490"/>
  </g>

  <path
    d="M 15 40 H 24 L 29 33 L 34 47 L 39 21 L 43 57 L 47 32 L 51 44 L 55 40 H 65"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle cx="40" cy="16" r="2.5" fill="#67E8F9"/>
  <circle cx="40" cy="64" r="2.5" fill="#5EEAD4"/>
  <circle cx="16" cy="40" r="2.5" fill="#38BDF8"/>
  <circle cx="64" cy="40" r="2.5" fill="#34D399"/>
</svg>
