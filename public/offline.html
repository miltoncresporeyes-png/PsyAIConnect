<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d9488">
<title>Sin conexión · PsyDoctor</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f8fafc;color:#0f172a;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
  main{max-width:420px;text-align:center}
  img{width:72px;height:72px;border-radius:18px}
  h1{font-size:1.5rem;margin:16px 0 8px}
  p{color:#475569;line-height:1.5;margin:8px 0}
  button{margin-top:16px;min-height:44px;padding:0 24px;border:0;border-radius:10px;background:#0d9488;color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
  .help{margin-top:28px;padding:14px;border-radius:12px;background:#fff;border:1px solid #e2e8f0;font-size:.9rem;text-align:left}
  .help a{color:#0f766e;font-weight:600}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="PsyDoctor">
  <h1>Sin conexión</h1>
  <p>No pudimos conectarnos a PsyDoctor. Revisa tu internet e inténtalo de nuevo. Por seguridad, no guardamos tus datos de salud en este dispositivo.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
  <div class="help">
    <strong>¿Necesitas ayuda ahora?</strong>
    <p>Línea de prevención del suicidio: <a href="tel:*4141">*4141</a><br>
    Salud Responde: <a href="tel:600 360 7777">600 360 7777</a><br>
    Emergencias: <a href="tel:131">131</a></p>
  </div>
</main>
</body>
</html>
